name: CI/CD Deploy

on:
  push:
    branches:
      - production   # jalankan saat push ke branch production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          cd /var/www/api-relisign.entigi.co.id   # lokasi project di server
          git pull origin production
          composer install --no-dev --optimize-autoloader
          php artisan migrate --force
          php artisan cache:clear
          EOF
      - name: Notify API after successful deploy
        if: success()
        run: |
          curl -X POST http://wa-center.entigi.co.id/v1/wa/send \
            -H "Content-Type: application/json" \
            -d '{"phone":"08881264670","message": "*GIT Notification*\n\nDeploye Branch Production success\nproject : api-relisign.entigi.co.id\nbranch : production\n\n"}'